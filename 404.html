<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEXORIA</title></head>
<body style="margin:0;background:#090a12;color:#fff;font-family:system-ui,sans-serif"><div style="min-height:100vh;display:grid;place-items:center"><div style="text-align:center;opacity:.85"><strong>NEXORIA</strong><div style="margin-top:8px">Restoring page…</div></div></div>
<script>
(function(){
  try {
    var path=location.pathname||'/';
    var base='/NEXORIA/website/';
    if(!path.startsWith(base)) base=(/github\.io$/i.test(location.hostname)&&path.split('/').filter(Boolean).length)?'/'+path.split('/').filter(Boolean)[0]+'/':'/';
    var target=path+location.search+location.hash;
    sessionStorage.setItem('tk_redirect_path',target);
    location.replace(location.origin+base);
  } catch(e) { location.replace('/NEXORIA/website/'); }
})();
</script></body></html>
