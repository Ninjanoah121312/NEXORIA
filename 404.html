<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORIA</title>
<script>
(function(){
  try {
    var path = window.location.pathname || "/";
    var parts = path.split("/").filter(Boolean);
    var base = /github\.io$/i.test(window.location.hostname) && parts.length ? "/" + parts[0] + "/" : "/";
    sessionStorage.setItem("tk_redirect_path", path + window.location.search + window.location.hash);
    window.location.replace(new URL(base, window.location.origin).href);
  } catch (e) { window.location.replace("/"); }
})();
</script>
</head>
<body></body>
</html>
