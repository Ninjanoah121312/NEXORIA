<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXORIA</title><link rel="icon" type="image/png" sizes="64x64" href="/NEXORIA/site/images/logo.png?v=20261001.35"><link rel="shortcut icon" href="/NEXORIA/site/images/logo.png?v=20261001.35">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a12;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{text-align:center;padding:36px 44px;border:1px solid #2b2d43;border-radius:18px;background:#10121d;box-shadow:0 20px 70px #0008}.brand{font-weight:850;font-size:22px}.muted{color:#9498ab;margin-top:8px}</style>
</head>
<body><main class="card"><div class="brand">NEXORIA</div><div class="muted">Restoring page…</div></main>
<script>
(function(){
  try {
    var path=location.pathname||'/';
    var parts=path.split('/').filter(Boolean);
    var repo=/github\.io$/i.test(location.hostname)&&parts.length?('/'+parts[0]+'/'):'/';
    var lower=path.toLowerCase();
    var repoNoSlash=repo.replace(/\/$/,'');
    // Collapse accidental /REPO/REPO/... paths before the SPA fallback runs.
    var repoPrefix=repoNoSlash.toLowerCase()+'/';
    var duplicatedPrefix=repoPrefix+repoNoSlash.replace(/^\//,'').toLowerCase()+'/';
    if(lower===duplicatedPrefix.slice(0,-1) || lower.indexOf(duplicatedPrefix)===0){
      var duplicateRest=path.slice(duplicatedPrefix.length);
      var duplicateTarget=repoNoSlash+(duplicateRest?'/'+duplicateRest:'');
      if(!duplicateTarget.endsWith('/')) duplicateTarget+='/';
      history.replaceState({},'',duplicateTarget+location.search+location.hash);
      location.replace(location.origin+duplicateTarget+location.search+location.hash);
      return;
    }
    var cleanTerms=(lower===repoNoSlash.toLowerCase()+'/terms');
    var cleanPrivacy=(lower===repoNoSlash.toLowerCase()+'/privacy');
    if(cleanTerms || cleanPrivacy){
      var page=cleanTerms?'terms':'privacy';
      var source=repo+'site/policy/'+page+'.html';
      fetch(source,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('policy fetch failed');return r.text();}).then(function(html){
        var base=repo+'site/policy/';
        html=html.replace('</head>','<base href="'+base+'"></head>');
        document.open(); document.write(html); document.close();
        history.replaceState({},'',repo+page);
      }).catch(function(){ location.replace(repo); });
      return;
    }
    var legacyPrefix=(repoNoSlash+'/website');
    var restorePath=path;
    if(lower===legacyPrefix.toLowerCase() || lower.indexOf(legacyPrefix.toLowerCase()+'/')===0){
      restorePath=repoNoSlash + path.slice(legacyPrefix.length);
      if(!restorePath.endsWith('/')) restorePath += '/';
    }
    if(restorePath===repo || restorePath===repoNoSlash || restorePath.endsWith('/')) restorePath=repo;
    var restore=restorePath+location.search+location.hash;
    sessionStorage.setItem('tk_redirect_path',restore);
    location.replace(location.origin+repo);
  } catch(e) { location.replace('/'); }
})();
</script></body></html>
