<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXORIA</title><link rel="icon" type="image/png" sizes="64x64" href="/NEXORIA/site/images/logo.png?v=20261002.23"><link rel="shortcut icon" href="/NEXORIA/site/images/logo.png?v=20261002.23">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a12;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{text-align:center;padding:36px 44px;border:1px solid #2b2d43;border-radius:18px;background:#10121d;box-shadow:0 20px 70px #0008}.brand{font-weight:850;font-size:22px}.muted{color:#9498ab;margin-top:8px}</style>
</head>
<body><main class="card"><div class="brand">NEXORIA</div><div class="muted">Restoring page…</div></main>
<script>
(function(){
  try {
    var path=location.pathname||'/';
    var parts=path.split('/').filter(Boolean);
    var repo=/github\.io$/i.test(location.hostname)&&parts.length?('/'+parts[0]+'/'):'/';
    var repoNoSlash=repo.replace(/\/$/,'');
    var lower=path.toLowerCase();
    var legacyPrefix=(repoNoSlash+'/website').toLowerCase();
    var restorePath=path;
    if(lower===legacyPrefix || lower.indexOf(legacyPrefix+'/')===0){
      restorePath=repoNoSlash + path.slice(legacyPrefix.length);
      if(!restorePath.endsWith('/')) restorePath+='/';
    }
    if(!restorePath.startsWith(repo)) restorePath=repo + restorePath.replace(/^\/+/, '');
    // Keep the public invite URL as /NEXORIA/invite while reusing the existing invite page.
    if (lower === (repoNoSlash + '/invite').toLowerCase() || lower === (repoNoSlash + '/invite/').toLowerCase()) {
      fetch(repo + 'site/invite.html?inviteRoute=' + Date.now(), {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('invite fetch failed');
        return r.text();
      }).then(function(html){
        history.replaceState({},'',repo+'invite'+location.search+location.hash);
        document.open();
        document.write(html);
        document.close();
      }).catch(function(){ location.replace(repo); });
      return;
    }
    // GitHub Pages has no server-side SPA rewrite. Render index.html directly
    // inside the 404 response instead of bouncing the browser to the homepage.
    // This keeps /NEXORIA/leaderboards, /dashboard, /profile, etc. addressable.
    sessionStorage.setItem('tk_redirect_path', restorePath+location.search+location.hash);
    fetch(repo+'index.html?spa404='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('index fetch failed');
      return r.text();
    }).then(function(html){
      history.replaceState({},'',restorePath+location.search+location.hash);
      document.open();
      document.write(html);
      document.close();
    }).catch(function(){ location.replace(repo); });
  } catch(e) { location.replace('/'); }
})();
</script></body></html>
