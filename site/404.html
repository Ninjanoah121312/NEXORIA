<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORIA</title></head>
<body style="margin:0;background:#090a12;color:#fff;font-family:system-ui,sans-serif"><div style="min-height:100vh;display:grid;place-items:center"><div style="text-align:center;opacity:.85"><strong>NEXORIA</strong><div style="margin-top:8px">Restoring page…</div></div></div>
<script>
(function(){
  try {
    var p=location.pathname||'/';
    var m=p.match(/^(.*\/site\/)/i);
    var base=m?m[1]:'/NEXORIA/site/';
    var target=p+location.search+location.hash;
    sessionStorage.setItem('tk_redirect_path',target);
    location.replace(location.origin+base);
  } catch(e) { location.replace('/NEXORIA/site/'); }
})();
</script></body></html>
