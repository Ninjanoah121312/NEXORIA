<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Install NEXORIA</title><link rel="icon" type="image/png" sizes="64x64" href="images/logo.png?v=20261003.21"><link rel="shortcut icon" href="images/logo.png?v=20261003.21"><meta name="description" content="Install the NEXORIA Discord bot.">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a12;color:#f7f7fb;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(560px,calc(100% - 32px));padding:32px;border:1px solid #2b2d43;border-radius:20px;background:linear-gradient(180deg,#121421,#0d0e17);box-shadow:0 24px 70px #0008;text-align:center}.logo{width:72px;height:72px;object-fit:contain;border-radius:18px;margin-bottom:14px}.eyebrow{color:#a78bfa;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;margin:6px 0 8px}.sub{color:#a9acbd;margin:0 auto 24px;max-width:430px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:11px;border:1px solid #6d45df;background:#6d35d9;color:#fff;text-decoration:none;font-weight:750}.hint{margin-top:16px;color:#777b8e;font-size:12px}</style></head>
<body><main class="card"><img class="logo" src="images/logo.png" alt="NEXORIA"><div class="eyebrow">Discord Integration</div><h1 class="title">Install NEXORIA</h1><p class="sub">You’re being redirected to Discord to add NEXORIA to a server you manage.</p><a id="install" class="btn" href="#">Continue to Discord</a><div class="hint">NEXORIA requests Administrator access so every enabled bot feature can work without missing Discord permissions.</div></main>
<script>(async()=>{const cfg=await fetch('data/config.json?invite='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>({}));const u=new URL('https://discord.com/oauth2/authorize');u.searchParams.set('client_id',cfg.DISCORD_CLIENT_ID||'1545012669113827488');u.searchParams.set('scope','bot applications.commands');u.searchParams.set('permissions','8');const a=document.getElementById('install');a.href=u.toString();setTimeout(()=>location.replace(u.toString()),250)})();</script></body></html>
